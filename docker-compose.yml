version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: s7_mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=smart_infrastructure_audit
    restart: always

volumes:
  mongodb_data:
    driver: local
